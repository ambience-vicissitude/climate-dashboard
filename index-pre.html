<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gridstack Starter</title>
  <link href="https://cdn.jsdelivr.net/npm/gridstack@9.2.1/dist/gridstack.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }
    .grid-stack-item-content {
      background-color: #f4f4f4;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="grid-stack">
    <!-- Add this within your Gridstack container -->
    <div class="grid-stack-item" gs-w="4" gs-h="2">
      <div class="grid-stack-item-content" id="climate-widget">
        Loading climate data...
      </div>
    </div>
    <div class="grid-stack-item" gs-w="4" gs-h="2">
      <div class="grid-stack-item-content" id="open-meteo-widget">
        Loading climate projections...
      </div>
    </div>
    <div class="grid-stack-item" gs-w="4" gs-h="2">
      <div class="grid-stack-item-content" id="geomet-widget">
        Loading Canadian climate data...
      </div>
    </div>
    <div class="grid-stack-item" gs-w="4" gs-h="2">
      <div class="grid-stack-item-content" id="ghg-widget">
        Loading GHG concentrations...
      </div>
    </div>
    
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gridstack@9.2.1/dist/gridstack-all.min.js"></script>
  <script>
    
    // JavaScript to fetch and display climate data
    document.addEventListener('DOMContentLoaded', function () {
      const ghgUrl = 'https://global-warming.org/api/co2-api';
      fetch(ghgUrl)
        .then(response => response.json())
        .then(data => {
          const latest = data.co2[data.co2.length - 1];
          const content = `
            <h3>CO₂ Concentration</h3>
            <p>${latest.trend} ppm</p>
            <p>Year: ${latest.year}</p>
          `;
          document.getElementById('ghg-widget').innerHTML = content;
        })
        .catch(error => {
          console.error('Error fetching GHG data:', error);
          document.getElementById('ghg-widget').innerText = 'Failed to load data.';
        });


      const geoMetUrl = 'https://api.weather.gc.ca/collections/climate-monthly/items?lang=en&limit=1';
      fetch(geoMetUrl)
        .then(response => response.json())
        .then(data => {
          const item = data.features[0].properties;
          const content = `
            <h3>${item.station_name}</h3>
            <p>Mean Temp: ${item.mean_temp}°C</p>
            <p>Month: ${item.month}</p>
          `;
          document.getElementById('geomet-widget').innerHTML = content;
        })
        .catch(error => {
          console.error('Error fetching GeoMet data:', error);
          document.getElementById('geomet-widget').innerText = 'Failed to load data.';
        });


      const openMeteoUrl = 'https://climate-api.open-meteo.com/v1/climate?latitude=43.85&longitude=-79.02&start=2025-06-01&end=2025-06-30&daily=temperature_2m_max&temperature_unit=celsius&timezone=America%2FToronto';
      fetch(openMeteoUrl)
        .then(response => response.json())
        .then(data => {
          const content = `
            <h3>June 2025 Max Temp</h3>
            <p>${data.daily.temperature_2m_max[0]}°C</p>
          `;
          document.getElementById('open-meteo-widget').innerHTML = content;
        })
        .catch(error => {
          console.error('Error fetching Open-Meteo data:', error);
          document.getElementById('open-meteo-widget').innerText = 'Failed to load data.';
        });


      fetch('https://global-warming.org/api/temperature-api')
        .then(response => response.json())
        .then(data => {
          const latest = data.result[data.result.length - 1];
          const content = `
            <h3>Global Temp Anomaly</h3>
            <p>Year: ${latest.time}</p>
            <p>Temperature Anomaly: ${latest.station}</p>
          `;
          document.getElementById('climate-widget').innerHTML = content;
        })
        .catch(error => {
          console.error('Error fetching climate data:', error);
          document.getElementById('climate-widget').innerText = 'Failed to load data.';
        });
      const grid = GridStack.init({
        cellHeight: 100,
        float: true,
        resizable: {
          handles: 'e, se, s, sw, w'
        }
      });

      // Sample widgets
      grid.load([
        {x: 0, y: 0, w: 3, h: 2, content: 'climate-widget'},
        {x: 3, y: 0, w: 3, h: 2, content: 'open-meteo-widget'},
        {x: 3, y: 0, w: 3, h: 2, content: 'geomet-widget'},
      ]);
    });
  </script>
</body>
</html>
